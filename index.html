<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>PATTERN RETRIEVAL</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: #050a05;
    color: #4dff6e;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }

  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: #050a05;
    overflow: hidden;
  }

  /* ── CANVAS ── */
  #bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  /* ── TOP HUD ── */
  #top-hud {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 10px 14px 0;
    flex-shrink: 0;
  }

  #status-box {
    background: rgba(0,20,5,0.85);
    border: 1px solid #4dff6e33;
    padding: 8px 12px;
    font-size: clamp(9px, 2vw, 11px);
    line-height: 1.9;
    min-width: 140px;
  }
  #status-box span.lbl { color: #4dff6e66; }
  #status-box span.val { color: #4dff6e; font-weight: bold; }

  #export-btn {
    background: transparent;
    border: 1px solid #4dff6e55;
    color: #4dff6e;
    font-family: 'Courier New', monospace;
    font-size: clamp(9px, 2vw, 11px);
    padding: 6px 12px;
    cursor: pointer;
    letter-spacing: 0.1em;
    transition: background 0.15s;
    white-space: nowrap;
  }
  #export-btn:hover { background: #4dff6e22; }

  /* ── MAIN STAGE ── */
  #stage {
    position: relative;
    z-index: 5;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* crosshairs */
  .ch {
    position: absolute;
    width: 20px; height: 20px;
    border: 1.5px solid #4dff6e66;
    border-radius: 50%;
    pointer-events: none;
  }
  .ch::before, .ch::after {
    content: ''; position: absolute; background: #4dff6e66;
  }
  .ch::before { width: 1.5px; height: 7px; left: 50%; transform: translateX(-50%); top: -5px; }
  .ch::after  { height: 1.5px; width: 7px; top: 50%; transform: translateY(-50%); left: -5px; }
  #ch-tl { top: 8px; left: 8px; }
  #ch-tr { top: 8px; right: 8px; }
  #ch-bl { bottom: 8px; left: 8px; }
  #ch-br { bottom: 8px; right: 8px; }

  /* scan ring */
  #scan-ring {
    position: absolute;
    border-radius: 50%;
    border: 1.5px solid #4dff6e44;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    animation: ping 2.4s ease-out infinite;
    z-index: 1;
  }
  @keyframes ping {
    0%   { width: 60px;  height: 60px;  opacity: 0.8; }
    100% { width: 320px; height: 320px; opacity: 0; }
  }

  /* title */
  #title-wrap {
    position: relative;
    z-index: 6;
    text-align: center;
    cursor: pointer;
    user-select: none;
    padding: 0 16px;
  }
  .title-line {
    display: block;
    font-weight: 900;
    letter-spacing: 0.1em;
    color: #4dff6e;
    text-shadow: 0 0 18px #4dff6e55;
    line-height: 1.05;
    word-break: break-word;
    transition: font-size 0.2s;
  }
  #tl1 { font-size: clamp(32px, 10vw, 80px); }
  #tl2 { font-size: clamp(26px, 8vw, 64px); }

  /* pulse overlay text */
  #pulse-overlay {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    z-index: 7;
    pointer-events: none;
    text-align: center;
    padding: 0 20px;
  }
  #pulse-overlay.active { display: flex; }
  #pulse-txt {
    font-weight: 900;
    letter-spacing: 0.15em;
    color: #4dff6e;
    text-shadow: 0 0 20px #4dff6e77;
    word-break: break-word;
    line-height: 1.1;
    font-size: clamp(24px, 7vw, 56px);
  }

  /* mode + color row */
  #controls {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    flex-shrink: 0;
  }

  #mode-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .mode-btn {
    background: transparent;
    border: 1px solid #4dff6e44;
    color: #4dff6e88;
    font-family: 'Courier New', monospace;
    font-size: clamp(9px, 2.2vw, 11px);
    padding: 5px 12px;
    cursor: pointer;
    border-radius: 2px;
    letter-spacing: 0.08em;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .mode-btn.active, .mode-btn:hover {
    color: #4dff6e;
    border-color: #4dff6e;
    background: #4dff6e11;
  }

  #color-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #color-row span {
    font-size: 9px;
    color: #4dff6e44;
    letter-spacing: 0.12em;
  }
  .color-dot {
    width: 18px; height: 18px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s, border-color 0.15s;
  }
  .color-dot:hover { transform: scale(1.2); }
  .color-dot.active { border-color: #fff; }

  /* ── BOTTOM INPUT ── */
  #input-bar {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    background: #050a05;
    border-top: 1px solid #4dff6e33;
    flex-shrink: 0;
  }
  #input-bar span.prompt { color: #4dff6e66; font-size: 12px; flex-shrink: 0; }
  #title-input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: #4dff6e;
    font-family: 'Courier New', monospace;
    font-size: clamp(11px, 3vw, 13px);
    caret-color: #4dff6e;
  }
  #title-input::placeholder { color: #4dff6e33; }
  .bar-btn {
    background: transparent;
    border: 1px solid #4dff6e44;
    color: #4dff6e;
    font-family: 'Courier New', monospace;
    font-size: clamp(9px, 2.2vw, 11px);
    padding: 4px 10px;
    cursor: pointer;
    letter-spacing: 0.08em;
    white-space: nowrap;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .bar-btn:hover { background: #4dff6e22; }

  /* ── LOG LINES ── */
  #log {
    position: absolute;
    bottom: 58px;
    left: 14px;
    z-index: 8;
    font-size: clamp(9px, 2vw, 10px);
    color: #4dff6e55;
    line-height: 1.8;
    pointer-events: none;
  }

  /* ── CURSOR DOT (desktop) ── */
  #cursor-dot {
    position: fixed;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #4dff6e;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 0.1s;
    box-shadow: 0 0 5px #4dff6e;
  }

  /* ── GLITCH ── */
  @keyframes glitch-shift {
    0%,100% { clip-path: none; transform: none; }
    10% { clip-path: inset(10% 0 80% 0); transform: translateX(-4px); }
    20% { clip-path: inset(60% 0 10% 0); transform: translateX(4px); }
    30% { clip-path: none; transform: none; }
  }
  .glitching { animation: glitch-shift 0.4s steps(1) forwards; }

  /* scrollbar hide */
  ::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="app">
  <canvas id="bg"></canvas>
  <div id="cursor-dot"></div>

  <!-- TOP HUD -->
  <div id="top-hud">
    <div id="status-box">
      <div><span class="lbl">TIME › </span><span class="val" id="s-time">00:00:00</span></div>
      <div><span class="lbl">SIG  › </span><span class="val" id="s-sig">██░░ 61%</span></div>
      <div><span class="lbl">NODE › </span><span class="val" id="s-node">NODE-00</span></div>
      <div><span class="lbl">STAT › </span><span class="val" style="color:#4dff6e">ONLINE</span></div>
    </div>
    <button id="export-btn" onclick="exportHTML()">↓ EXPORT</button>
  </div>

  <!-- STAGE -->
  <div id="stage">
    <div id="scan-ring"></div>
    <div class="ch" id="ch-tl"></div>
    <div class="ch" id="ch-tr"></div>
    <div class="ch" id="ch-bl"></div>
    <div class="ch" id="ch-br"></div>

    <div id="title-wrap" onclick="triggerGlitch()">
      <span class="title-line" id="tl1">PATTERN</span>
      <span class="title-line" id="tl2">RETRIEVAL</span>
    </div>

    <div id="pulse-overlay">
      <div id="pulse-txt">PATTERN RETRIEVAL</div>
    </div>

    <div id="log">
      <div id="ll1">&gt; signal_lock acquired</div>
      <div id="ll2">&gt; node_sync: stable</div>
      <div id="ll3">&gt; awaiting input_</div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div id="controls">
    <div id="mode-row">
      <button class="mode-btn active" data-mode="globe" onclick="setMode('globe')">▣ BINARY RAIN</button>
      <button class="mode-btn" data-mode="rain" onclick="setMode('rain')">◎ SONAR PING</button>
      <button class="mode-btn" data-mode="pulse" onclick="setMode('pulse')">♥ HEARTBEAT</button>
    </div>
    <div id="color-row">
      <span>— COLOR NODE —</span>
      <div class="color-dot active" style="background:#4dff6e" data-color="#4dff6e" onclick="setColor(this)"></div>
      <div class="color-dot" style="background:#00cfff" data-color="#00cfff" onclick="setColor(this)"></div>
      <div class="color-dot" style="background:#ff4dff" data-color="#ff4dff" onclick="setColor(this)"></div>
      <div class="color-dot" style="background:#ffb300" data-color="#ffb300" onclick="setColor(this)"></div>
      <div class="color-dot" style="background:#ff4444" data-color="#ff4444" onclick="setColor(this)"></div>
      <div class="color-dot" style="background:#ffffff" data-color="#ffffff" onclick="setColor(this)"></div>
    </div>
  </div>

  <!-- INPUT BAR -->
  <div id="input-bar">
    <span class="prompt">&gt;&gt;</span>
    <input id="title-input" type="text" placeholder="Enter new title..." autocomplete="off" autocorrect="off" spellcheck="false"/>
    <button class="bar-btn" onclick="applyTitle()">SET</button>
    <button class="bar-btn" onclick="resetTitle()">RESET</button>
  </div>
</div>

<script>
// ── STATE ──
let mode = 'globe';
let accentColor = '#4dff6e';
let customText = '';
let glitching = false;
let frame = 0;
let mouseX = 0, mouseY = 0;

// ── CANVAS ──
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── COLOR ──
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}
function applyColorToDOM(hex) {
  const root = document.documentElement;
  document.querySelectorAll('.title-line').forEach(el => {
    el.style.color = hex;
    el.style.textShadow = `0 0 18px ${hex}55`;
  });
  document.getElementById('pulse-txt').style.color = hex;
  document.getElementById('pulse-txt').style.textShadow = `0 0 20px ${hex}77`;
  document.getElementById('scan-ring').style.borderColor = hex + '44';
  document.querySelectorAll('.ch').forEach(c => {
    c.style.borderColor = hex + '88';
    c.querySelectorAll('::before,::after');
  });
}

function setColor(el) {
  document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
  el.classList.add('active');
  accentColor = el.dataset.color;
  applyColorToDOM(accentColor);
  addLog('> color_node: ' + accentColor);
}

// ── GLOBE ──
function drawGlobe(t) {
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  const r  = Math.min(W, H) * 0.26;
  const {r:cr, g:cg, b:cb} = hexToRgb(accentColor);
  const glow = 0.5 + 0.1 * Math.sin(t * 0.02);
  ctx.strokeStyle = `rgba(${cr},${cg},${cb},${0.2 * glow})`;
  ctx.lineWidth = 0.9;
  const mx = (mouseX / W - 0.5) * 0.35;
  for (let lat = -80; lat <= 80; lat += 20) {
    const y0   = r * Math.sin((lat * Math.PI) / 180);
    const rLat = r * Math.cos((lat * Math.PI) / 180);
    ctx.beginPath();
    for (let lon = 0; lon <= 360; lon += 2) {
      const a  = ((lon + t * 0.3 + mx * 60) * Math.PI) / 180;
      const xp = cx + rLat * Math.cos(a);
      const yp = cy + y0 * 0.98 - rLat * Math.sin(a) * 0.22;
      lon === 0 ? ctx.moveTo(xp, yp) : ctx.lineTo(xp, yp);
    }
    ctx.stroke();
  }
  for (let lon = 0; lon < 360; lon += 20) {
    ctx.beginPath();
    for (let lat = -90; lat <= 90; lat += 2) {
      const a  = ((lon + t * 0.3 + mx * 60) * Math.PI) / 180;
      const y0   = r * Math.sin((lat * Math.PI) / 180);
      const rLat = r * Math.cos((lat * Math.PI) / 180);
      const xp = cx + rLat * Math.cos(a);
      const yp = cy + y0 * 0.98 - rLat * Math.sin(a) * 0.22;
      lat === -90 ? ctx.moveTo(xp, yp) : ctx.lineTo(xp, yp);
    }
    ctx.stroke();
  }
}

// ── RAIN ──
const cols = [];
let rainReady = false;
function drawRain() {
  const W = canvas.width, H = canvas.height;
  const colCount = Math.floor(W / 16);
  if (!rainReady) {
    for (let i = cols.length; i < colCount; i++) cols.push(Math.random() * H);
    rainReady = true;
  }
  const {r,g,b} = hexToRgb(accentColor);
  ctx.fillStyle = `rgba(${r},${g},${b},0.8)`;
  ctx.font = '13px Courier New';
  for (let i = 0; i < Math.min(cols.length, colCount); i++) {
    ctx.fillText(String.fromCharCode(0x30A0 + Math.random() * 96), i * 16, cols[i]);
    cols[i] = cols[i] > H + 20 ? 0 : cols[i] + 18;
  }
}

// ── PULSE ──
let pulseRings = [];
function drawPulse() {
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  if (frame % 40 === 0) pulseRings.push({ r: 20, alpha: 0.9 });
  pulseRings = pulseRings.filter(p => p.alpha > 0.01);
  const {r:cr,g:cg,b:cb} = hexToRgb(accentColor);
  for (const p of pulseRings) {
    ctx.beginPath();
    ctx.arc(cx, cy, p.r, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(${cr},${cg},${cb},${p.alpha})`;
    ctx.lineWidth = 1;
    ctx.stroke();
    p.r += 3.5; p.alpha *= 0.94;
  }
  ctx.beginPath();
  ctx.arc(cx, cy, 8, 0, Math.PI*2);
  ctx.fillStyle = accentColor;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, 15, 0, Math.PI*2);
  ctx.strokeStyle = accentColor + '66';
  ctx.lineWidth = 1;
  ctx.stroke();
}

// ── GLITCH DRAW ──
function drawGlitch() {
  const W = canvas.width, H = canvas.height;
  for (let i = 0; i < 5; i++) {
    const gy = Math.random()*H, gh = Math.random()*8+1, gx = Math.random()*20-10;
    try { ctx.drawImage(canvas, 0, gy, W, gh, gx, gy, W, gh); } catch(e){}
  }
  const {r,g,b} = hexToRgb(accentColor);
  ctx.fillStyle = `rgba(${r},${g},${b},${Math.random()*0.07})`;
  ctx.fillRect(0, Math.random()*H, W, Math.random()*4);
}

// ── RENDER LOOP ──
function render() {
  frame++;
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = mode === 'rain' ? 'rgba(5,10,5,0.13)' : 'rgba(5,10,5,0.93)';
  ctx.fillRect(0, 0, W, H);
  if (mode === 'globe') drawGlobe(frame);
  else if (mode === 'rain') drawRain();
  else if (mode === 'pulse') drawPulse();
  if (glitching) drawGlitch();
  requestAnimationFrame(render);
}
render();

// ── MODE ──
function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === m));
  const isP = m === 'pulse';
  document.getElementById('title-wrap').style.display   = isP ? 'none' : 'block';
  document.getElementById('pulse-overlay').classList.toggle('active', isP);
  addLog('> mode: ' + m.toUpperCase());
}

// ── TITLE ──
function splitTitle(text) {
  const words = text.toUpperCase().trim().split(/\s+/);
  const mid = Math.ceil(words.length / 2);
  return [words.slice(0, mid).join(' '), words.slice(mid).join(' ')];
}

function applyTitle() {
  const val = document.getElementById('title-input').value.trim();
  if (!val) return;
  customText = val.toUpperCase();
  const [l1, l2] = splitTitle(val);
  document.getElementById('tl1').textContent = l1;
  document.getElementById('tl2').textContent = l2;
  document.getElementById('pulse-txt').textContent = customText;
  addLog('> title: ' + customText.slice(0,24));
  triggerGlitch();
}

function resetTitle() {
  customText = '';
  document.getElementById('tl1').textContent = 'PATTERN';
  document.getElementById('tl2').textContent = 'RETRIEVAL';
  document.getElementById('pulse-txt').textContent = 'PATTERN RETRIEVAL';
  document.getElementById('title-input').value = '';
  addLog('> title: RESET');
}

// live preview as you type
document.getElementById('title-input').addEventListener('input', function() {
  const val = this.value.trim();
  if (val) {
    const [l1, l2] = splitTitle(val);
    document.getElementById('tl1').textContent = l1;
    document.getElementById('tl2').textContent = l2;
    document.getElementById('pulse-txt').textContent = val.toUpperCase();
  } else {
    resetTitle();
  }
});
document.getElementById('title-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') applyTitle();
});

// ── GLITCH ──
function triggerGlitch() {
  glitching = true;
  document.getElementById('title-wrap').classList.add('glitching');
  addLog('> glitch_event detected');
  setTimeout(() => {
    glitching = false;
    document.getElementById('title-wrap').classList.remove('glitching');
  }, 450);
}

// ── LOG ──
let logLines = ['> signal_lock acquired', '> node_sync: stable', '> awaiting input_'];
function addLog(line) {
  logLines.push(line);
  if (logLines.length > 4) logLines.shift();
  ['ll1','ll2','ll3'].forEach((id,i) => {
    const el = document.getElementById(id);
    if (el) el.textContent = logLines[i] || '';
  });
}

// ── STATUS CLOCK ──
function tickClock() {
  const now = new Date();
  const p = n => String(n).padStart(2,'0');
  document.getElementById('s-time').textContent =
    `${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`;
  const sig = Math.floor(55 + Math.random()*40);
  const bars = '█'.repeat(Math.floor(sig/25)) + '░'.repeat(4 - Math.floor(sig/25));
  document.getElementById('s-sig').textContent = bars + ' ' + sig + '%';
}
tickClock();
setInterval(tickClock, 1000);

// ── MOUSE ──
document.addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  const dot = document.getElementById('cursor-dot');
  dot.style.left = e.clientX + 'px';
  dot.style.top  = e.clientY + 'px';
  dot.style.opacity = 1;
});
document.addEventListener('mouseleave', () => {
  document.getElementById('cursor-dot').style.opacity = 0;
});

// ── EXPORT ──
function exportHTML() {
  const html = document.documentElement.outerHTML;
  const blob = new Blob([html], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pattern-retrieval.html';
  a.click();
  addLog('> snapshot exported');
}

// ── TOUCH: prevent scroll bounce ──
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
</script>
</body>
</html>
